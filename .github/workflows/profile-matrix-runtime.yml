name: LibreKick profile runtime matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [a1000, a500, a500plus, a600]

    name: profile-${{ matrix.profile }}

    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb xdotool imagemagick python3-pil

      - name: Build and statically validate retained profile
        run: python3 tools/build_profile.py "${{ matrix.profile }}"

      - name: Run profile in FS-UAE
        run: |
          chmod +x ci/fs-uae/run-profile-runtime-color-gate.sh
          xvfb-run -a -s '-screen 0 1280x900x24' ci/fs-uae/run-profile-runtime-color-gate.sh "${{ matrix.profile }}"

      - name: Upload profile runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librekick-${{ matrix.profile }}-runtime-qualification
          path: |
            build/fs-uae/profiles/${{ matrix.profile }}/result.txt
            build/fs-uae/profiles/${{ matrix.profile }}/diagnostic.png
            build/fs-uae/profiles/${{ matrix.profile }}/fs-uae.log
            build/fs-uae/profiles/${{ matrix.profile }}/fs-uae-version.txt
            build/fs-uae/profiles/${{ matrix.profile }}/profile.txt
            build/fs-uae/profiles/${{ matrix.profile }}/rom.txt
            build/fs-uae/profiles/${{ matrix.profile }}/config.txt
            build/${{ matrix.profile }}/*.rom
          if-no-files-found: warn
