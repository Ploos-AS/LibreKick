name: A1000 bootstrap static qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a1000-bootstrap-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install m68k binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu

      - name: Build and check A1000.3 bootstrap ROM
        run: make check-a1000-loader

      - name: Upload A1000.3 bootstrap ROM
        uses: actions/upload-artifact@v4
        with:
          name: librekick-a1000.3-bootstrap-static
          path: build/a1000/librekick-a1000.3-bootstrap.rom
          if-no-files-found: error
